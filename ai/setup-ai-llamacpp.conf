# shellcheck shell=bash
# shellcheck disable=SC2034
# CONFIG :: llama.cpp (sourced by setup-ai)
# ------------------------------------------------------------------------------
# Runtime configuration for the local llama.cpp OpenAI-compatible server.
# setup_llamacpp() reads this file, asks for a model + memory profile, then
# writes the result to an EnvironmentFile that configs-single/llamacpp.service
# consumes.
#
# DATA ONLY - do not put logic here. setup-ai sources this file into its own
# scope; everything must be a plain assignment.
# ------------------------------------------------------------------------------

# CONFIG :: paths ----------------------------------------------------------------
LLAMACPP_CONFIG_DIR="${LLAMACPP_CONFIG_DIR:-"$HOME/.config/llamacpp"}"
LLAMACPP_ENV_FILE="${LLAMACPP_ENV_FILE:-"$LLAMACPP_CONFIG_DIR/llamacpp.env"}"
LLAMACPP_PRESET_FILE="${LLAMACPP_PRESET_FILE:-"$LLAMACPP_CONFIG_DIR/models.ini"}"
LLAMACPP_UNIT_NAME="llamacpp.service"

# ------------------------------------------------------------------------------
# CONFIG :: how the memory budget is spent
# ------------------------------------------------------------------------------
# Total RAM at inference is:
#
#   weights + KV cache + compute buffers + OS/other
#     weights        fixed per GGUF quant (see LLAMACPP_MODELS "size_gib")
#     KV cache       layers x kv_heads x head_dim x 2 (K and V) x bytes/elem x ctx
#     compute        batch buffers, scales, backend workspace (~1 GiB here)
#
# The weights are fixed once you pick a quant, so ctx is the only lever that
# scales: every doubling of ctx doubles the KV cache. setup_llamacpp() solves
# for it and shows you the arithmetic before writing anything.
#
# KV cache bytes per element, as a percentage of f16 (derived from the ggml
# block sizes: q8_0 = 1.0625 B, q5_1 = 0.75, q5_0 = 0.6875, q4_0 = 0.625).
#   f16 = 2.0 B = 100%. Lower = more context per GiB, slightly lossy.
# q8_0 is the sweet spot: half the memory of f16, essentially lossless.
# q4_0/q5_* buy context but can visibly hurt long-document recall - only use
# them on a big box where the extra context actually matters.
LLAMACPP_KV_PCT_F16=100
LLAMACPP_KV_PCT_Q8_0=53
LLAMACPP_KV_PCT_Q5_1=38
LLAMACPP_KV_PCT_Q4_0=31

# Context sizes offered in the picker (tokens), smallest first.
LLAMACPP_CTX_CHOICES="4096 8192 16384 32768 65536 131072"
# Pre-highlighted in the picker.
LLAMACPP_CTX_DEFAULT=32768
# KV cache types offered in the picker, best-quality first.
LLAMACPP_KV_TYPES="q8_0 f16 q5_1 q4_0"
LLAMACPP_KV_DEFAULT="q8_0"

# Fixed reserve for compute buffers and llama.cpp overhead (not KV).
LLAMACPP_COMPUTE_RESERVE_MIB="1024"
# Always keep this much RAM free for the rest of the system (never KV).
LLAMACPP_RAM_FLOOR_MIB="1024"

# ------------------------------------------------------------------------------
# CONFIG :: server basics
# ------------------------------------------------------------------------------
# Bound to loopback on purpose: the server has no authentication unless
# LLAMACPP_API_KEY is enabled below. Other local services reach it at
# http://127.0.0.1:8080/v1.
LLAMACPP_HOST="127.0.0.1"
# Bind address. The fzf picker in setup_llamacpp() offers loopback, the wildcard
# and every global IPv4 address on this host, labelled with its scope; this value
# is only which one is pre-selected. Leave empty to default to LLAMACPP_HOST.
LLAMACPP_BIND=""
LLAMACPP_PORT="8080"
# Concurrent server slots. The KV cache is shared across slots, so per-request
# context is roughly ctx / slots - 1 gives one request the whole window.
LLAMACPP_N_PARALLEL="1"
# Keep the model's thinking in the conversation history. Off by default: it grows
# every turn, which eats a small context window quickly, and most clients only
# care about the final answer. Turn it on for multi-turn "reason then refine".
LLAMACPP_REASONING_PRESERVE=0
LLAMACPP_UI=0
LLAMACPP_METRICS=1
# CORS. Empty = derive from the bind address (see setup-ai). CORS is enforced
# by browsers only: curl, opencode and the HTTP SDKs never send an Origin
# header and are unaffected.
#
# ONE value, not a list. llama.cpp only understands "*", "localhost", or a
# single literal origin - despite the help text saying "comma-separated", a
# comma-joined value is emitted verbatim as Access-Control-Allow-Origin and then
# matches no browser at all. To allow a page from another host, set its exact
# origin here, e.g. LLAMACPP_CORS_ORIGINS="http://192.168.111.50:3000"
LLAMACPP_CORS_ORIGINS=""

# CONFIG :: API authentication ---------------------------------------------------
# 1 = generate a random key on first 'setup-ai -sll' and keep it at
# LLAMACPP_API_KEY_FILE (chmod 600, never in git). Clients send:
#   Authorization: Bearer <key>
# 0 = no auth. Only acceptable while bound to loopback.
#
# The key is a shared secret for a private subnet, not a high-security secret,
# but it does stop anything on the LAN from using your GPU/RAM by accident.
LLAMACPP_API_KEY=1
LLAMACPP_API_KEY_FILE="${LLAMACPP_API_KEY_FILE:-"$LLAMACPP_CONFIG_DIR/api-key"}"

# ------------------------------------------------------------------------------
# CONFIG :: GPU (optional - everything below is ignored on a CPU-only build)
# ------------------------------------------------------------------------------
# auto      let llama.cpp offload as much as fits
# all       offload everything
# N         offload N layers, leave the rest on the CPU
LLAMACPP_NGL="auto"
# how to spread a model over multiple GPUs: layer (pipeline, default), row or
# tensor (experimental, needs matched cards)
LLAMACPP_SPLIT_MODE="layer"
# fractions per GPU, e.g. "0.6,0.4" for a 16 GB + 8 GB pair. Empty = let
# llama.cpp decide. Only set this when you have more than one GPU.
LLAMACPP_TENSOR_SPLIT=""

# ------------------------------------------------------------------------------
# CONFIG :: prediction (speculative decoding)
# ------------------------------------------------------------------------------
# Speculative decoding drafts several tokens at once and verifies them in one
# batch - it speeds up generation, it does not speed up prompt processing.
#
#   ngram-simple   matches earlier n-grams in this very conversation. Needs no
#                  extra model and no extra RAM. Best for repetitive work like
#                  editing code - the default recommendation.
#   draft-simple   a small standalone draft model. Costs RAM, works for any
#                  target model. Needs LLAMACPP_SPEC_DRAFT below.
#   draft-mtp      multi-token prediction baked into the target model itself.
#                  Only for models whose repo ships an MTP head (the -MTP- GGUFs).
#   none           off
LLAMACPP_SPEC_TYPE="ngram-simple"
# Draft model for draft-* types: "<hf_repo>:<quant>". Match its family to the
# target model (same tokenizer/vocab) or acceptance collapses.
LLAMACPP_SPEC_DRAFT=""
# Tokens drafted per step. Higher = more headroom, more wasted work on a miss.
LLAMACPP_SPEC_N_MAX="16"
# Draft model threads; -1 = same as the main model.
LLAMACPP_SPEC_THREADS=""

# ------------------------------------------------------------------------------
# CONFIG :: vision
# ------------------------------------------------------------------------------
# 0 = do not fetch the mmproj projector (saves RAM + disk, text only).
# 1 = download it when the repo has one, enabling image input over the API.
LLAMACPP_MMPROJ=0

# ------------------------------------------------------------------------------
# CONFIG :: router mode (autoload) - 0 = classic single-model server
# ------------------------------------------------------------------------------
# Router mode runs one endpoint that can serve EVERY model in LLAMACPP_MODELS,
# loading each on demand and evicting the least recently used one past
# LLAMACPP_MODELS_MAX. Clients pick a model per request ("model": "<id>").
#
#   0  serve exactly the one model selected in the picker. Simplest, lowest
#      memory, but switching models means re-running 'setup-ai -sll'.
#   1  serve all catalog models on demand. One stable baseURL, and every model
#      shows up in the opencode model picker.
#
# Because weights are swapped in and out, size --models-max for your RAM: each
# resident model holds its weights plus its own KV cache.
LLAMACPP_ROUTER=1
LLAMACPP_MODELS_MAX=1
# 1 = load a model the first time a request asks for it. 0 = only models marked
# load-on-startup in models.ini come up; the rest must be loaded explicitly.
LLAMACPP_MODELS_AUTOLOAD=1
# Unload a model after N idle seconds (-1 = never). Handy when you mostly run
# one model but occasionally want another.
LLAMACPP_SLEEP_IDLE_SECONDS=-1

# ------------------------------------------------------------------------------
# CONFIG :: model catalog
# ------------------------------------------------------------------------------
# One entry per line, pipe-separated. Several entries may share an id: that is
# the same model at a different weight quantisation, and the id stays stable
# (it is the opencode model name and the router model id).
#
#   id | display | hf_repo | quant | size_gib | kv_kib | ctx_max | reasoning | tier
#
# id         stable model id - becomes the API model name. Never change it once
#            clients depend on it.
# hf_repo    Hugging Face GGUF repo, exactly <owner>/<name>.
# quant      quant token matched against the repo filenames. MUST correspond to
#            a real file: llama.cpp greps for "<quant>." / "<quant>-" and fails
#            the download when nothing matches, so a typo is a hard error rather
#            than a silent wrong-file download.
# size_gib   on-disk size of that one quant file (verified against the HF API).
# kv_kib     KV-cache KiB per token at f16, from 2 * layers * kv_heads *
#            head_dim * 2 bytes. Drives the context solver.
# ctx_max    ceiling offered for this model; RAM usually binds first.
# reasoning  1 -> opencode gets "reasoning": true. This is verified against the
#            live server per model, not assumed from the family name: as of this
#            pin, lfm25-2.6b returns reasoning_content while lfm25-1.2b-instruct
#            does not. Models that were too large to load here are marked from
#            their chat template and may need checking - the flag only changes how
#            opencode presents thinking, it does not force a model to think.
# tier       human label for the picker.
#
# Adding a model: list https://huggingface.co/<owner>/<name>/tree/main and
# check the quant and its size really exist before adding a line.
# ------------------------------------------------------------------------------
# shellcheck disable=SC2016
LLAMACPP_MODELS=(
  "lfm25-1.2b-instruct|LFM2.5 1.2B Instruct|LiquidAI/LFM2.5-1.2B-Instruct-GGUF|Q4_K_M|0.68|16|32768|0|4-bit"
  "lfm25-1.2b-instruct|LFM2.5 1.2B Instruct|LiquidAI/LFM2.5-1.2B-Instruct-GGUF|Q8_0|1.16|16|32768|0|8-bit"
  "lfm25-2.6b|LFM2.5 2.6B|LiquidAI/LFM2.5-2.6B-GGUF|Q4_K_M|1.56|30|32768|1|4-bit"
  "lfm25-2.6b|LFM2.5 2.6B|LiquidAI/LFM2.5-2.6B-GGUF|Q8_0|2.68|30|32768|1|8-bit"
  "lfm25-8b-a1b|LFM2.5 8B-A1B MoE|LiquidAI/LFM2.5-8B-A1B-GGUF|Q4_K_M|4.80|24|32768|0|4-bit"
  "lfm25-8b-a1b|LFM2.5 8B-A1B MoE|LiquidAI/LFM2.5-8B-A1B-GGUF|Q5_K_M|5.62|24|32768|0|5-bit"
  "lfm25-8b-a1b|LFM2.5 8B-A1B MoE|LiquidAI/LFM2.5-8B-A1B-GGUF|Q8_0|8.39|24|32768|0|8-bit"
  "gemma4-12b-it-qat|Gemma 4 12B it (QAT)|unsloth/gemma-4-12B-it-qat-GGUF|UD-Q4_K_XL|6.26|192|131072|0|QAT 4-bit"
  "gemma4-26b-a4b-it|Gemma 4 26B-A4B it MoE|unsloth/gemma-4-26B-A4B-it-GGUF|UD-IQ3_S|10.51|120|131072|0|3-bit"
  "gemma4-26b-a4b-it|Gemma 4 26B-A4B it MoE|unsloth/gemma-4-26B-A4B-it-GGUF|UD-IQ4_XS|12.66|120|131072|0|4-bit"
  "gemma4-26b-a4b-it|Gemma 4 26B-A4B it MoE|unsloth/gemma-4-26B-A4B-it-GGUF|UD-Q4_K_M|15.78|120|131072|0|4-bit"
  "qwen3-30b-a3b-2507|Qwen3 30B-A3B Instruct 2507|unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF|UD-Q3_K_XL|12.88|48|65536|0|3-bit"
  "qwen3-30b-a3b-2507|Qwen3 30B-A3B Instruct 2507|unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF|Q4_K_M|17.28|48|65536|0|4-bit"
  "qwen3.6-35b-a3b-mtp|Qwen3.6 35B-A3B MTP MoE|unsloth/Qwen3.6-35B-A3B-MTP-GGUF|UD-Q3_K_XL|16.04|40|131072|1|3-bit"
  "qwen3.6-35b-a3b-mtp|Qwen3.6 35B-A3B MTP MoE|unsloth/Qwen3.6-35B-A3B-MTP-GGUF|UD-Q4_K_M|21.11|40|131072|1|4-bit"
  "qwen3.6-35b-a3b-mtp|Qwen3.6 35B-A3B MTP MoE|unsloth/Qwen3.6-35B-A3B-MTP-GGUF|UD-Q6_K|27.95|40|131072|1|6-bit"
)

# Pre-selected in the model picker (first matching id). The rest of that id's
# quant tiers stay selectable, smallest first.
LLAMACPP_MODELS_DEFAULT="qwen3.6-35b-a3b-mtp"
