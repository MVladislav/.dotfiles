# CONFIG :: opencode providers ---------------------------------------------------
# Provider configs merged into the "provider" key of opencode.jsonc.
# API keys MUST be env-var references ({env:VAR}) - never hardcoded values.
# SOURCE: https://public.mammouth.ai/opencode (mammouth.ai example config)
# shellcheck disable=SC2034
OPENCODE_CONFIG_PROVIDER_NAMES=("mammouth" "llamacpp")
# Pre-selected in the fzf picker (space-separated names).
# 'llamacpp' is generated by 'setup-ai -sll'; selecting it without running that
# first is a no-op, so leave the default empty.
# shellcheck disable=SC2034
OPENCODE_CONFIG_PROVIDER_DEFAULT=''

# Mammouth.ai - OpenAI-compatible API via the LiteLLM provider in opencode.
# API key: https://mammouth.ai/app/account/settings/api (keep in env, e.g.
# Live model list: https://model-explorer.mammouth.ai/ (from api.mammouth.ai/public/models)
# Use models with: opencode --model litellm/<model-id> (or "model" in opencode.jsonc).
#
# Default model picks and why (IDs verified live; limits are max_input/output tokens):
# - mammouth-recommended  always follows their current best-value pick (GLM-5.2 +
#   minimax-m3 fallback), so it never goes stale - good safe default.
# - claude-opus-5         top-tier deep reasoning; matches their quota fallback
#                         chain (Opus -> Sonnet -> Haiku), so it is the flagship pick.
# - claude-sonnet-5       balanced workhorse: near-flagship quality, lower cost -
#                         best default for everyday coding.
# - claude-haiku-4-5      cheap + fast tier that completes the fallback chain.
# - gpt-5.6-luna          OpenAI flagship alternative for parity/coverage.
# - gemini-3.1-pro-preview Google flagship, 1M context - strongest for huge files.
# - deepseek-v4-pro       coding-focused, great value, huge 384k output.
# - deepseek-v4-flash     cheapest fast model - quick/mechanical tasks.
# - sonar-pro             Perplexity web-search/research model (only search-capable one).
#
# Schema notes (https://opencode.ai/config.json): model entries support
# name/family/limit/reasoning/cost/options/variants - no free-text "description"
# field, so rationale lives in this comment. Variants are ignored for now:
# built-in variants only exist for known providers (anthropic/openai/google), and
# custom variants are options overrides whose passthrough through the mammouth
# proxy is unverifiable without an API key. Add per model later if needed, e.g.:
#   "claude-sonnet-5": { ..., "variants": { "thinking": { "thinking": { "type": "enabled", "budgetTokens": 16000 } } } }
# shellcheck disable=SC2034
OPENCODE_CONFIG_PROVIDER_MAMMOUTH='
{
  "litellm": {
    "npm": "@ai-sdk/openai-compatible",
    "options": {
      "apiKey": "{env:OPENCODE_MAMMOUTH_API_KEY}",
      "baseURL": "https://api.mammouth.ai/v1"
    },
    "models": {
      "mammouth-recommended": {
