# llama.cpp (local) - llama-server's OpenAI-compatible endpoint.
# SOURCE: https://opencode.ai/docs/providers/#llamacpp
#
# GENERATED, DO NOT EDIT HERE. setup_llamacpp() ('setup-ai -sll') rebuilds
# OPENCODE_CONFIG_PROVIDER_LLAMACPP from the model picked in the fzf selector,
# using the same host/port/context as the generated server env file - so the
# model id, limit.context and baseURL can never drift apart. The model catalog
# lives in ai/setup-ai-llamacpp.conf.
