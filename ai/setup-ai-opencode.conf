# CONFIG :: opencode skills ------------------------------------------------------
# Upstream skill sources fetched by setup_opencode_skills(). One line per
# source: "label|repo|rev|subdir" - label qualifies skill names in
# OPENCODE_SKILL_NAMES ("label/name"); rev is a commit to pin (empty = default
# branch); subdir is the repo-relative dir holding the skills. A name may carry
# extra path segments below subdir (mattpocock nests per category), and the
# installer flattens to the leaf dir name, which is the skill ID opencode uses.
# Duplicate leaves across selected names: the first wins, the rest are skipped.
# Discover more skills via agentskills.in.
# shellcheck disable=SC2034
OPENCODE_SKILL_SOURCES=(
  "getsentry|https://github.com/getsentry/skills|e7a87fa72645158f9b5e722cbb1c7e09266f48f1|skills" # pragma: allowlist secret
