# CONFIG :: global OpenCode policies -------------------------------------------
# Protect the user's staged/unstaged review boundary. Git shell commands are
# denied by default; these inspection-only commands are the narrow allowlist.
# Policy denials are enforced after agent permissions and project approvals.
# shellcheck disable=SC2034
OPENCODE_CONFIG_POLICIES='[
  {"action":"tool.use","resource":"shell:git *","effect":"ask"},
  {"action":"tool.use","resource":"shell:git status *","effect":"allow"},
  {"action":"tool.use","resource":"shell:git diff *","effect":"allow"},
  {"action":"tool.use","resource":"shell:git log *","effect":"allow"},
  {"action":"tool.use","resource":"shell:git show *","effect":"allow"},
  {"action":"tool.use","resource":"shell:git rev-parse *","effect":"allow"},
  {"action":"tool.use","resource":"shell:git branch --show-current","effect":"allow"}
]'

