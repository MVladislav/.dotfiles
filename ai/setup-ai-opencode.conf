# CONFIG :: opencode skills ------------------------------------------------------
# Upstream skill sources fetched by setup_opencode_skills(). One line per
# source: "label|repo|rev|subdir" — label qualifies skill names in
# OPENCODE_SKILL_NAMES ("label/name"); rev is a commit to pin (empty = default
# branch); subdir is the repo-relative dir containing one dir per skill (each
# with a SKILL.md). Discover more skills via agentskills.in (see ai/SKILLS.md).
# shellcheck disable=SC2034
OPENCODE_SKILL_SOURCES=(
  "getsentry|https://github.com/getsentry/skills|e7a87fa72645158f9b5e722cbb1c7e09266f48f1|skills" # pragma: allowlist secret
  "homeassistant|https://github.com/homeassistant-ai/skills||skills"
)
# Skill names selectable via fzf. "label/name" picks the source explicitly;
# a plain "name" falls back to the first source in OPENCODE_SKILL_SOURCES.
# shellcheck disable=SC2034
OPENCODE_SKILL_NAMES=("security-review" "gh-review-requests" "code-review" "gha-security-review" "homeassistant/home-assistant-best-practices")
# Pre-selected in the fzf picker (space-separated names)
