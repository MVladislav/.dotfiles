# SOURCE: https://github.com/morluto/rea (README + docs/client-configuration.md)
# REA = "Reverse Engineer Anything", an MIT MCP server + CLI for reverse
# engineering APKs, firmware, native binaries, .NET, Electron/JS apps and
# pcaps. Its own `rea setup` would write this entry into opencode.jsonc, but
# that file is GENERATED here - keep this snippet as the single source and do
# not let `rea setup --client opencode` edit the live config.
# - No "enabled" key: V2 keeps a configured-but-unconnected server with
#   "disabled"; omitting the flag connects it. (The github/context7 snippets
#   above use "enabled", which V2 ignores - harmless, but not the documented key.)
# - "timeout": {"startup": ...} is raised because the first `npx` run downloads
#   the package; V2's default startup budget is 30s.
# - The package version is pinned to the release matching OPENCODE_SKILL_SOURCES'
#   rea pin below, so the MCP server and the reverse-engineer-anything skill
#   describe the same release. Bump both together.
# - REA never installs analysis engines. Per-target prerequisites are
#   caller-supplied: Node ^22.19 || ^24.11 || >=26, JADX + a full JDK for APKs,
#   Apktool for resources, adb for devices, Binwalk/Unblob for firmware,
#   Ghidra/Hopper/IDA for native binaries, tshark for pcaps. Check with
#   `rea doctor --json`.
# Tools are exposed as rea_* (e.g. rea_inspect_artifact, rea_analyze_function).
# shellcheck disable=SC2034
OPENCODE_CONFIG_MCP_REA='
{
  "servers": {
    "rea": {
      "type": "local",
      "command": ["npx", "-y", "rea-agents@6.5.0", "mcp"],
      "timeout": {
        "startup": 180000
      }
    }
  }
}
'

