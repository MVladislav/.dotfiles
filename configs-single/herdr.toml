# herdr server reload-config
onboarding = false

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord, gruvbox, one-dark, solarized, kanagawa, rose-pine, vesper
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[update]
channel = "stable"
version_check = true
manifest_check = true

# Background notification popup delivery
[ui.toast]
delivery = "herdr" # off | herdr | terminal | system

[ui]
agent_panel_sort = "spaces"

# Automatically copy text selected by mouse drag.
# Set false to keep drag selection visible without copying; double-click still copies a word.
# copy_on_select = true

# Show detected/reported agent labels in split pane borders when no manual pane name is set.
show_agent_labels_on_pane_borders = true

# Accent color for highlights, borders, and navigation UI.
# Accepts: hex (#89b4fa), named colors (cyan, blue, magenta), or rgb(r,g,b)
accent = "magenta"
